name: Publish npm package
run-name: Release ${{ inputs.release_type }}${{ inputs.dry_run && ' (preview)' || '' }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version: patch = fix, minor = feature, major = breaking, current = unchanged'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
          - current
      dry_run:
        description: 'Preview only: test and package without publishing'
        type: boolean
        default: false

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up publishing tools
        run: |
          npm install --global npm@11.6.2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Test, package, publish through OIDC, and sync version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/release.mjs "$RELEASE_TYPE" "$DRY_RUN"
      - name: Keep the tested package and release plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/project-check-release/
          if-no-files-found: ignore
          retention-days: 14
