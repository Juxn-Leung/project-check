<header class="app-header"><div class="brand"><span class="brand-mark" aria-hidden="true">⌘</span><div><div class="brand-name">PROJECT CHECK</div><div class="brand-note">理解项目 · 查看修改 · 验证结果</div></div></div><div class="project-title" id="project-title"></div><nav class="top-tabs" role="tablist" aria-label="项目视图"><button type="button" role="tab" data-view="graph">关系图</button><button type="button" role="tab" data-view="features">功能表</button><button type="button" role="tab" data-view="fields">字段表</button><button type="button" role="tab" data-view="changes">本次修改</button></nav><div class="header-status" id="header-status"></div></header>

<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('project-data').textContent),model=data.model||{},review=data.review||null;
const rows=x=>Array.isArray(x)?x:[],index=xs=>new Map(rows(xs).map(x=>[x.id,x]));
const currentNodes=index(model.nodes),currentFeatures=index(model.features),beforeModel=review?.graph_before||{},beforeNodes=index(beforeModel.nodes),beforeFeatures=index(beforeModel.features),changes=index(review?.node_changes),allFeatures=new Map([...beforeFeatures,...currentFeatures]),inventory=data.inventory||{},scenarios=index(inventory.scenarios),requirements=index(inventory.requirements),results=index(data.acceptance?.results),modules=index(inventory.modules);
for(const change of changes.values()){if(change.before&&!beforeNodes.has(change.id))beforeNodes.set(change.id,change.before);}
const nodeIds=[...new Set([...currentNodes.keys(),...beforeNodes.keys(),...changes.keys()])];
const NAMES={page:'页面',component:'组件',api:'接口',function:'方法',data:'数据结构',external:'外部服务',feature:'功能',calls:'调用',reads:'读取',writes:'写入',navigates:'跳转',contains:'包含',depends_on:'依赖',references:'引用',modified:'已修改',added:'新增',removed:'已移除',affected:'受影响',unresolved:'待确认',unchanged:'未修改',observed:'已阅读来源',inferred:'推断关系',unknown:'尚未确认',reviewed:'已分析',current:'当前证据',frozen:'修改前快照',stale:'来源已变',unavailable:'暂无片段',passed:'通过',failed:'失败',blocked:'阻塞',skipped:'跳过',incomplete:'验收不完整','not-run':'未执行',implemented:'已登记实现',partial:'部分实现',behavior:'行为变化',rationale:'修改原因',learning:'学习要点',deviation:'与计划的差异','one-to-one':'一对一','one-to-many':'一对多','many-to-one':'多对一','many-to-many':'多对多','foreign-key':'数据库外键',logical:'逻辑关联'};
const COLORS={modified:'#4679bb',added:'#27865f',removed:'#b95f62',affected:'#b9852b',unresolved:'#8a7b91',unchanged:'#a4afa8'},label=x=>NAMES[x]||x||'未知';

const main=document.getElementById('main'),detail=document.getElementById('detail');let graphLayout=null,graphScroll=null,graphStage=null,graphCanvas=null;

function add(parent,...children){for(const child of children)if(child)parent.append(child);return parent;}
function button(text,fn,cls){const n=el('button',text,cls);n.type='button';n.addEventListener('click',fn);return n;}

function section(title){return add(el('section',null,'detail-section'),el('h3',title));}
function safeLink(href,text){if(typeof href!=='string'||!/^((\.\.\/)+|\.\/)/.test(href)||/[\\\x00-\x20]/.test(href))return el('span',text);const a=el('a',text);a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a;}
function symbol(node){return node?.symbol||node?.name||node?.id||'未登记节点';}
function status(id){if(!review)return'unchanged';if(changes.has(id))return changes.get(id).status;return rows(review.impact?.direct_nodes).includes(id)?'unresolved':rows(review.impact?.dependent_nodes).includes(id)?'affected':'unchanged';}
function getNode(id,phase=state.phase){const change=changes.get(id);return phase==='before'?(change?.before||beforeNodes.get(id)||change?.after||currentNodes.get(id)):(change?.after||currentNodes.get(id)||change?.before||beforeNodes.get(id));}
function getFeature(id){return (state.phase==='before'?beforeFeatures.get(id):currentFeatures.get(id))||allFeatures.get(id);}
function getEdges(){const old=rows(beforeModel.edges),now=rows(model.edges);if(!review)return now;const preferred=state.phase==='before'?old:now,secondary=state.phase==='before'?now:old,ids=new Set(preferred.map(e=>e.id));return [...preferred.map(e=>({...e,ghost:false})),...secondary.filter(e=>!ids.has(e.id)&&(status(e.from)==='removed'||status(e.to)==='removed'||state.phase==='before')).map(e=>({...e,ghost:true}))];}
function sourceList(node){const host=el('div');for(const source of rows(node?.sources)){const row=el('div',null,'source-item');add(row,safeLink(source.href,source.path),el('span',source.line?' : '+source.line+(source.end_line&&source.end_line!==source.line?'–'+source.end_line:''):''));host.append(row);}if(!host.childNodes.length)host.append(el('p','尚未关联源码位置。','muted'));return host;}

add(host,miniFields(node.inputs,'输入参数'),miniFields(node.outputs,'返回结果'),miniFields(node.fields,'数据字段'));const steps=section('它如何完成工作');if(rows(node.steps).length)steps.append(list(node.steps,true));else steps.append(el('p','尚未登记逐步说明。可以先沿调用与数据关系查看，再结合源码补充。'));host.append(steps);const edges=nodeEdges(node.id);add(host,relationSection(node.id,'谁会调用它',edges.filter(e=>e.to===node.id&&['calls','depends_on','contains','navigates'].includes(e.kind))),relationSection(node.id,'它调用或依赖什么',edges.filter(e=>e.from===node.id&&['calls','depends_on','contains','navigates'].includes(e.kind))),relationSection(node.id,'读取与写入的数据',edges.filter(e=>['reads','writes','references'].includes(e.kind))));if(rows(node.errors).length)host.append(add(section('异常与边界'),list(node.errors)));const learning=notesFor(node.id).filter(n=>n.kind==='learning');if(learning.length){const block=section('结合这次修改学习');learning.forEach(note=>block.append(el('div',note.text,'note')));host.append(block);}const source=section('代码位置');source.append(sourceList(node));const details=el('details');details.append(el('summary','来源状态与分析依据'));add(details,el('p',label(node.provenance)+' · '+label(node.freshness)),el('p','节点 ID：'+node.id));for(const ref of rows(node.sources))details.append(el('p',ref.path+' · SHA '+(ref.sha256||'未记录')));source.append(details);host.append(source);}
function snippetSection(node,title){const block=section(title);if(!node){block.append(el('p',title.includes('前')?'修改前尚不存在该节点。':'修改后已移除此节点。'));return block;}const snippets=rows(node.code_snippets);if(!snippets.length){add(block,el('p','没有已保存的源码片段。可通过代码位置查看原文件。'),sourceList(node));return block;}for(const snippet of snippets){add(block,el('h4',snippet.path+' : '+(snippet.line||1)+(snippet.end_line?'–'+snippet.end_line:'')),badge(snippet.state));if(typeof snippet.code==='string')block.append(el('pre',snippet.code,'code-block'));else block.append(el('p',snippet.reason||'该来源需要重新分析，未展示可能过期的代码。'));if(snippet.truncated)block.append(el('p','片段过长，展示已截断。'));}return block;}
function renderCode(host,node){const change=changes.get(node.id);if(review&&change){const codeDiffs=rows(change.code_diffs);if(codeDiffs.length){const block=section('这次改动的代码');for(const diff of codeDiffs){block.append(el('h4',diff.path));if(diff.available){const pre=el('pre',null,'code-block');String(diff.diff||'源码内容未变，可能是元数据变化。').split('\n').forEach(line=>pre.append(el('span',line,'diff-line '+(line.startsWith('+')&&!line.startsWith('+++')?'diff-add':line.startsWith('-')&&!line.startsWith('---')?'diff-remove':line.startsWith('@@')?'diff-hunk':''))));block.append(pre);if(diff.truncated)block.append(el('p','差异展示已截断，请结合完整源码。'));}else block.append(el('p',diff.reason||'未保存此段差异。'));}host.append(block);}add(host,snippetSection(change.before,'修改前的实现'),snippetSection(change.after,'修改后的实现'));}else host.append(snippetSection(node,'当前实现'));}
function relevantScenarios(node){const ids=new Set(rows(node.scenario_ids));for(const f of allFeatures.values())if(rows(f.node_ids).includes(node.id))rows(f.scenario_ids).forEach(id=>ids.add(id));return [...ids];}
function renderTests(host,node){const change=changes.get(node.id),recommendation=section('为什么需要回归');if(rows(change?.impact_paths).length)recommendation.append(list(change.impact_paths.map(p=>p.reason)));else recommendation.append(el('p',status(node.id)==='affected'?'依赖链连接到改动节点，需要重新检查相关输入、输出和失败情况。':'按该方法所属功能的验收场景检查实际行为；方法存在不代表功能通过。'));host.append(recommendation);const ids=relevantScenarios(node),block=section('关联验收场景');if(!ids.length)block.append(el('p','尚未关联可执行测试，当前不能据此确认功能完成。'));for(const id of ids){const scenario=scenarios.get(id),result=results.get(id),d=el('details'),summary=el('summary');add(summary,el('span',scenario?.title||id),el('span',' '),badge(result?.status||'not-run'));d.append(summary);if(scenario){d.append(el('p','测试：'+rows(scenario.tests).join('、')));for(const [key,title]of [['preconditions','前置条件'],['actions','实际操作'],['expected','预期结果']]){if(rows(scenario[key]).length)add(d,el('h4',title),list(scenario[key],true));}}if(result){d.append(el('p',result.reason||'请结合执行证据核对覆盖范围。'));for(const link of rows(result.links))d.append(add(el('div',null,'source-item'),safeLink(link.href,link.path)));}block.append(d);}host.append(block);const evidence=section('执行证据');evidence.append(el('p',data.acceptance?.message||'尚未载入执行记录。'));if(rows(data.acceptance?.gaps).length){const d=el('details');add(d,el('summary','查看覆盖缺口'),list(data.acceptance.gaps));evidence.append(d);}host.append(evidence);}
function renderFeatureDetail(feature){const head=el('div',null,'detail-header');add(head,el('div','功能说明','detail-type'),el('h2',feature.name),el('p',feature.description||'尚未补充用途','detail-purpose'));detail.append(head);const body=el('div',null,'detail-body'),entry=section('从入口理解');const ids=rows(feature.entry_node_ids).length?feature.entry_node_ids:rows(feature.node_ids);for(const id of ids.slice(0,15))entry.append(button(symbol(getNode(id)),()=>selectNode(id),'relation-link'));if(!ids.length)entry.append(el('p','尚未登记代码节点。'));body.append(entry);const reqs=section('业务要求');if(rows(feature.requirement_ids).length)for(const id of feature.requirement_ids){const req=requirements.get(id);reqs.append(el('p',req?.title||id));}else reqs.append(el('p','尚未关联已登记需求。'));body.append(reqs);const tests=section('当前验收');add(tests,badge(feature.acceptance?.state||'not-run'),el('p',data.acceptance?.message||'尚未载入执行结果。'));body.append(tests);const notes=notesFor(feature.id,'feature');if(notes.length){const block=section('功能改动说明');notes.forEach(note=>add(block,el('h4',label(note.kind)),el('div',note.text,'note')));body.append(block);}detail.append(body);}
function renderOverviewDetail(){const block=el('div',null,'detail-empty');add(block,el('h2',state.view==='changes'?'沿着修改理解代码':'从功能进入代码'),el('p',state.view==='changes'?'点击图中的方法，查看具体改动、调用关系和需要验证的场景。':'点击一个功能展开实际方法，再点击方法查看职责、输入输出与代码。'));if(review){const counts=new Map();for(const id of nodeIds){const s=status(id);counts.set(s,(counts.get(s)||0)+1);}const overview=section('本次节点变化');for(const key of ['modified','added','removed','affected','unresolved'])if(counts.get(key))overview.append(el('p',label(key)+' · '+counts.get(key)));block.append(overview);const unmapped=rows(review.impact?.unmapped_changes);if(unmapped.length){const d=el('details');add(d,el('summary',unmapped.length+' 个变动文件尚未映射'),list(unmapped.map(x=>x.path)));block.append(d);}}detail.append(block);}
function renderDetail(){detail.replaceChildren();const node=state.node?getNode(state.node):null;if(!node){if(state.feature&&getFeature(state.feature))renderFeatureDetail(getFeature(state.feature));else renderOverviewDetail();return;}const head=el('div',null,'detail-header'),type=el('div',null,'detail-type');add(type,el('span',label(node.kind)),review?el('span',label(status(node.id)),'node-status status-'+status(node.id)):null);const close=button('清除选择',()=>{state.node=null;state.field=null;render();},'detail-close');add(head,close,type,el('h2',node.name||symbol(node)),el('div',symbol(node),'detail-symbol'),el('p',node.description||'尚未补充该方法的职责说明。','detail-purpose'));detail.append(head);const tabs=el('nav',null,'detail-tabs');tabs.setAttribute('aria-label','节点详情');for(const [key,title]of [['meaning',node.kind==='function'?'方法说明':'节点说明'],['code','代码对比'],['tests','测试与回归']]){const b=button(title,()=>{state.detailTab=key;renderDetail();});b.setAttribute('aria-selected',String(state.detailTab===key));tabs.append(b);}detail.append(tabs);const body=el('div',null,'detail-body');if(state.detailTab==='meaning')renderMeaning(body,node);else if(state.detailTab==='code')renderCode(body,node);else renderTests(body,node);detail.append(body);}
function render(){main.replaceChildren();graphLayout=null;graphScroll=null;graphStage=null;graphCanvas=null;renderSidebar();renderHead();for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-selected',String(b.dataset.view===state.view));if(state.view==='features'||state.view==='fields')renderTable();else renderGraph();renderDetail();}
document.getElementById('project-title').textContent=model.title||'项目地图';document.title=(model.title||'项目地图')+' · Project Check';document.getElementById('header-status').textContent='离线快照 · '+String(data.generated_at||'').slice(0,10);document.getElementById('feature-search').addEventListener('input',renderSidebar);document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;if(state.view==='graph')state.node=null;state.query='';state.zoom=1;render();}));document.querySelector('.top-tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;const buttons=[...document.querySelectorAll('[data-view]')],index=buttons.indexOf(document.activeElement);if(index<0)return;event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[next].click();buttons[next].focus();});
if(review){const first=nodeIds.find(id=>status(id)==='modified')||nodeIds.find(id=>['added','removed','affected','unresolved'].includes(status(id)));if(first)state.node=first;}
render();
})();
